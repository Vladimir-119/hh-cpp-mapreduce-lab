[project]
name = "hh-cpp-lab"
version = "0.1.0"
description = "RustFS, own MapReduce and independent DuckDB analysis: variant 6"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2", "duckdb>=1.4,<2", "psutil>=7,<8",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

